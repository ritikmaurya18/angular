<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
    <button
      (click)="showQuickAdd = !showQuickAdd"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium"
    >
      {{ showQuickAdd ? 'Close' : '+ Quick Add' }}
    </button>
  </div>

  @if (isAtLimit) {
    <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded-lg">
      ⚠️ You've reached the maximum limit of {{ maxLimit }} todos. Delete some to add more.
    </div>
  }

  @if (showQuickAdd) {
    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <h2 class="text-lg font-semibold mb-4">Quick Add Todo</h2>
      <app-todo-form
        [categories]="categories"
        submitLabel="Add Todo"
        (formSubmit)="onQuickAdd($event)"
        (formCancel)="showQuickAdd = false"
      />
    </div>
  }

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    <app-stats-card title="Total" [value]="totalCount" icon="📋" color="blue" />
    <app-stats-card title="Pending" [value]="pendingCount" icon="⏳" color="yellow" />
    <app-stats-card title="In Progress" [value]="inProgressCount" icon="🔄" color="purple" />
    <app-stats-card title="Completed" [value]="completedCount" icon="✅" color="green" />
    <app-stats-card title="Overdue" [value]="overdueCount" icon="⚠️" color="red" />
  </div>

  <div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900">Recent Todos</h2>
      <a routerLink="/todos" class="text-blue-600 hover:text-blue-700 text-sm font-medium">
        View All →
      </a>
    </div>
    <div class="space-y-3">
      @for (todo of recentTodos; track todo.id) {
        <app-todo-item
          [todo]="todo"
          [categoryName]="getCategoryName(todo.categoryId)"
          [categoryColor]="getCategoryColor(todo.categoryId)"
          (toggleStatus)="onToggleStatus($event)"
          (delete)="onDelete($event)"
        />
      } @empty {
        <div class="text-center py-8 text-gray-400">
          No todos yet. Click "Quick Add" to get started!
        </div>
      }
    </div>
  </div>
</div>

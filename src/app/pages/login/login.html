<main class="min-h-screen bg-slate-50 px-5 py-10 text-slate-900 sm:px-8">
  <div class="mx-auto flex min-h-[calc(100vh-5rem)] w-full max-w-sm flex-col justify-center">
    <div class="mb-8">
      <div class="mb-6 flex h-11 w-11 items-center justify-center rounded-xl bg-slate-900 shadow-sm" aria-hidden="true">
        <span class="h-5 w-1.5 rounded-full bg-white"></span>
        <span class="ml-1.5 h-3.5 w-1.5 rounded-full bg-slate-400"></span>
      </div>
      <p class="mb-2 text-sm font-semibold tracking-wide text-slate-500">WELCOME BACK</p>
      <h1 class="text-3xl font-semibold tracking-tight">Sign in to {{ appName }}</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">A quieter way to keep your day on track.</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-[0_12px_35px_rgba(15,23,42,0.06)] sm:p-7">
      <form (ngSubmit)="onLogin()" class="space-y-5">
        @if (error) {
          <div class="rounded-lg border border-red-200 bg-red-50 px-3.5 py-3 text-sm text-red-700" role="alert">
            {{ error }}
          </div>
        }

        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email address</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
          />
        </div>

        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
            <span class="text-xs text-slate-400">Keep it secure</span>
          </div>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading || !email || !password"
          class="flex w-full items-center justify-center rounded-lg bg-slate-900 py-3 text-sm font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-40"
        >
          @if (loading) {
            <span class="inline-flex items-center gap-2">
              <span class="animate-spin text-base">⟳</span> Signing in...
            </span>
          } @else {
            Continue
            <span class="ml-2 text-slate-400" aria-hidden="true">→</span>
          }
        </button>
      </form>

      <div class="mt-6 border-t border-slate-100 pt-4 text-center text-xs text-slate-400">
        Demo access:
        <span class="font-mono text-slate-500">admin&#64;example.com</span>
        <span class="mx-1">·</span>
        <span class="font-mono text-slate-500">password123</span>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">Simple tasks. Clear progress.</p>
  </div>
</main>

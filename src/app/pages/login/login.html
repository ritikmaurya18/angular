<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900">{{ appName }}</h1>
      <p class="text-gray-500 mt-2">Sign in to manage your tasks</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <form (ngSubmit)="onLogin()" class="space-y-5">
        @if (error) {
          <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
            {{ error }}
          </div>
        }

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="admin@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="password123"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading || !email || !password"
          class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium text-lg"
        >
          @if (loading) {
            <span class="inline-flex items-center gap-2">
              <span class="animate-spin">⟳</span> Signing in...
            </span>
          } @else {
            Sign In
          }
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-gray-200 text-center text-sm text-gray-500">
        Demo: <span class="font-mono text-gray-700">admin&#64;example.com</span> / <span class="font-mono text-gray-700">password123</span>
      </div>
    </div>
  </div>
</div>

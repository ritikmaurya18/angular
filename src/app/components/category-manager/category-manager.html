<div class="space-y-4">
  <div class="flex gap-3 items-end">
    <div class="flex-1">
      <label class="block text-sm font-medium text-gray-700 mb-1">New Category</label>
      <input
        type="text"
        [(ngModel)]="newName"
        placeholder="Category name"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
      <input
        type="color"
        [(ngModel)]="newColor"
        class="w-12 h-10 border border-gray-300 rounded-lg cursor-pointer"
      />
    </div>
    <button
      (click)="onAdd()"
      [disabled]="!newName.trim()"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors"
    >
      Add
    </button>
  </div>

  <div class="space-y-2">
    @for (cat of categories; track cat.id) {
      <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg group">
        @if (editingId === cat.id) {
          <input
            type="color"
            [(ngModel)]="editColor"
            class="w-8 h-8 border border-gray-300 rounded cursor-pointer"
          />
          <input
            type="text"
            [(ngModel)]="editName"
            class="flex-1 px-3 py-1 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
          />
          <button (click)="saveEdit()" class="text-green-600 hover:text-green-700 font-medium text-sm">Save</button>
          <button (click)="cancelEdit()" class="text-gray-500 hover:text-gray-700 text-sm">Cancel</button>
        } @else {
          <span class="w-4 h-4 rounded-full shrink-0" [style.background]="cat.color"></span>
          <span class="flex-1 font-medium text-gray-800">{{ cat.name }}</span>
          <button
            (click)="startEdit(cat)"
            class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-blue-600 transition-all text-sm"
          >
            ✏️
          </button>
          <button
            (click)="onDelete(cat.id)"
            class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-600 transition-all text-sm"
          >
            🗑️
          </button>
        }
      </div>
    } @empty {
      <p class="text-gray-400 text-center py-4">No categories yet.</p>
    }
  </div>
</div>
